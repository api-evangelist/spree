    post:
      summary: Create a variant
      tags:
      - Variants
      security:
      - api_key: []
        bearer_auth: []
      description: 'Creates a new variant for a product. Supports nested prices and stock items.


        Option types and values are auto-created if they don''t exist.

        Prices are upserted by currency. Stock items are upserted by stock location.



        **Required scope:** `write_products` (for API-key authentication).'
      x-codeSamples:
      - lang: javascript
        label: Spree Admin SDK
        source: "import { createAdminClient } from '@spree/admin-sdk'\n\nconst client = createAdminClient({\n  baseUrl: 'https://your-store.com',\n  secretKey: 'sk_xxx',\n})\n\nconst variant = await client.products.variants.create('prod_86Rf07xd4z', {\n  sku: 'TSHIRT-L-NAVY',\n  options: [\n    { name: 'size', value: 'Large' },\n    { name: 'color', value: 'navy' },\n  ],\n  prices: [\n    { currency: 'USD', amount: 29.99, compare_at_amount: 34.99 },\n    { currency: 'EUR', amount: 27.99 },\n  ],\n  stock_items: [\n    { stock_location_id: 'sloc_UkLWZg9DAJ', count_on_hand: 25 },\n  ],\n})"
      parameters:
      - name: x-spree-api-key
        in: header
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        required: true
        description: Bearer token for admin authentication
        schema:
          type: string
      - name: product_id
        in: path
        required: true
        description: Product ID
        schema:
          type: string
      responses:
        '201':
          description: variant created
          content:
            application/json:
              example:
                id: variant_EfhxLZ9ck8
                product_id: prod_UkLWZg9DAJ
                sku: NEW-SKU-001
                options_text: 'Size: XL'
                track_inventory: true
                media_count: 0
                thumbnail_url: null
                purchasable: false
                in_stock: false
                backorderable: false
                weight: 0.0
                height: null
                width: null
                depth: null
                price:
                  id: price_EfhxLZ9ck8
                  amount: '24.99'
                  amount_in_cents: 2499
                  compare_at_amount: null
                  compare_at_amount_in_cents: null
                  currency: USD
                  display_amount: $24.99
                  display_compare_at_amount: null
                  price_list_id: null
                original_price: null
                option_values:
                - id: optval_gbHJdmfrXB
                  option_type_id: opt_gbHJdmfrXB
                  name: xl
                  label: XL
                  position: 1
                  color_code: null
                  option_type_name: size
                  option_type_label: Size
                  image_url: null
                  metadata: {}
                  created_at: '2026-06-12T17:25:21.569Z'
                  updated_at: '2026-06-12T17:25:21.569Z'
                metadata: {}
                position: 3
                cost_price: null
                cost_currency: USD
                barcode: null
                weight_unit: lb
                dimensions_unit: null
                deleted_at: null
                created_at: '2026-06-12T17:25:21.573Z'
                updated_at: '2026-06-12T17:25:21.575Z'
                tax_category_id: taxcat_UkLWZg9DAJ
                available_stock: 0
                reserved_quantity: 0
                total_on_hand: 0
                product_name: Product 804516
        '422':
          description: validation error
          content:
            application/json:
              example:
                error:
                  code: validation_error
                  message: Option value variants can't be blank
                  details:
                    option_value_variants:
                    - can't be blank
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sku:
                  type: string
                  example: SKU-001
                price:
                  type: number
                  example: 29.99
                compare_at_price:
                  type: number
                  example: 39.99
                cost_price:
                  type: number
                  example: 10.0
                cost_currency:
                  type: string
                  example: USD
                weight:
                  type: number
                height:
                  type: number
                width:
                  type: number
                depth:
                  type: number
                weight_unit:
                  type: string
                dimensions_unit:
                  type: string
                track_inventory:
                  type: boolean
                tax_category_id:
                  type: string
                options:
                  type: array
                  description: One pair per option type the variant participates in (e.g. size + color). Option types and values are auto-created if missing.
                  items:
                    type: object
                    required:
                    - name
                    - value
                    properties:
                      name:
                        type: string
                        example: size
                      value:
                        type: string
                        example: Small
                position:
                  type: integer
                barcode:
                  type: string
                prices:
                  type: array
                  description: Per-currency prices. Upserted by currency.
                  items:
                    type: object
                    required:
                    - currency
                    - amount
                    properties:
                      currency:
                        type: string
                        example: USD
                      amount:
                        type: number
                        example: 29.99
                      compare_at_amount:
                        type: number
                        example: 39.99
                stock_items:
                  type: array
                  description: Per-stock-location inventory. Upserted by stock_location_id.
                  items:
                    type: object
                    required:
                    - stock_location_id
                    - count_on_hand
                    properties:
                      stock_location_id:
                        type: string
                        description: Stock location ID (e.g. sloc_xxx)
                      count_on_hand:
                        type: integer
                        example: 50
                      backorderable:
                        type: boolean
