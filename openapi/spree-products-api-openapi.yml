                  created_at: '2026-06-12T17:25:03.263Z'
                  updated_at: '2026-06-12T17:25:03.263Z'
                original_price: null
                status: active
                metadata: {}
                deleted_at: null
                created_at: '2026-06-12T17:25:03.252Z'
                updated_at: '2026-06-12T17:25:03.269Z'
                tax_category_id: taxcat_UkLWZg9DAJ
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: product not found
          content:
            application/json:
              example:
                error:
                  code: record_not_found
