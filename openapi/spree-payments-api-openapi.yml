      summary: Create a payment
      tags:
      - Payments
      security:
      - api_key: []
        bearer_auth: []
      description: 'Creates a new payment for the order.


        **Required scope:** `write_payments` (for API-key authentication).'
      x-codeSamples:
      - lang: javascript
