        Groups from sibling stores are silently ignored. Returns counts of

        customers and groups that were processed (post store-scoping).



        **Required scope:** `write_customers` (for API-key authentication).'
      x-codeSamples:
      - lang: javascript
        label: Spree Admin SDK
        source: "import { createAdminClient } from '@spree/admin-sdk'\n\nconst client = createAdminClient({\n  baseUrl: 'https://your-store.com',\n  secretKey: 'sk_xxx',\n})\n\nconst result = await client.customers.bulkAddToGroups({\n  ids: ['cus_UkLWZg9DAJ', 'cus_QrLWXg9CAJ'],\n  customer_group_ids: ['cg_UkLWZg9DAJ'],\n})"
      parameters:
      - name: x-spree-api-key
        in: header
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: customers added to groups
          content:
            application/json:
              example:
                customer_count: 1
                customer_group_count: 1
              schema:
                type: object
                properties:
                  customer_count:
                    type: integer
                  customer_group_count:
                    type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - ids
              - customer_group_ids
              properties:
                ids:
                  type: array
                  items:
                    type: string
                  example:
                  - cus_UkLWZg9DAJ
                  - cus_QrLWXg9CAJ
                customer_group_ids:
                  type: array
                  items:
                    type: string
                  example:
